<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="options.css">
  <title>Bilibili Less 设置</title>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand"><img src="../icons/icon48.png" width="40" height="40" alt=""><div><h1>Bilibili Less 设置</h1><p>把时间留给你想看的内容。</p></div></div>
      <span class="save-status" id="save-status" role="status" aria-live="polite">正在读取…</span>
    </header>
    <p class="intro">默认设置已保留关注动态、搜索、收藏和正常播放。以下开关自动保存，可按需调整。</p>
    <fieldset id="settings-controls" disabled>
      <section class="section">
        <label class="switch-row primary"><span><strong>减少干扰</strong><small>暂停后，B 站页面恢复原样</small></span><input type="checkbox" id="enabled" role="switch"></label>
      </section>
      <section class="section">
        <div class="section-heading"><h2>关注与搜索</h2><p>从关注动态开始，想看什么就主动搜索。</p></div>
        <div class="module-grid">
          <label class="switch-row"><span><strong>首页回到关注动态</strong><small>首页、热门和分区入口回到关注动态</small></span><input type="checkbox" id="module-redirect" role="switch"></label>
          <label class="switch-row"><span><strong>允许主动搜索</strong><small>保留搜索框和有关键词的搜索结果</small></span><input type="checkbox" id="module-search" role="switch"></label>
          <label class="switch-row"><span><strong>隐藏推荐内容</strong><small>收起相关视频和动态页推荐入口</small></span><input type="checkbox" id="module-recommendations" role="switch"></label>
          <label class="switch-row"><span><strong>隐藏热搜与分享</strong><small>收起热搜、搜索建议和分享推广入口</small></span><input type="checkbox" id="module-exploration" role="switch"></label>
          <label class="switch-row"><span><strong>精简顶部导航</strong><small>收起直播、番剧等入口，保留搜索和账号</small></span><input type="checkbox" id="module-navigation" role="switch"></label>
          <label class="switch-row"><span><strong>隐藏动态互动</strong><small>收起关注动态中的评论、点赞和互动提示</small></span><input type="checkbox" id="module-dynamic" role="switch"></label>
        </div>
      </section>
      <section class="section">
        <div class="section-heading"><h2>观看体验</h2><p>保留播放器、简介、收藏和选集；看完一条再做选择。</p></div>
        <div class="module-grid">
          <label class="switch-row"><span><strong>播放结束后停下</strong><small>关闭自动连播，仍可手动选择下一集</small></span><input type="checkbox" id="module-autoplay" role="switch"></label>
          <label class="switch-row"><span><strong>隐藏结束推荐</strong><small>收起播放结束后的推荐视频</small></span><input type="checkbox" id="module-ending" role="switch"></label>
          <label class="switch-row"><span><strong>隐藏评论</strong><small>只专注当前视频的内容</small></span><input type="checkbox" id="module-comments" role="switch"></label>
          <label class="switch-row"><span><strong>隐藏弹幕</strong><small>收起滚动弹幕、输入框和弹幕列表</small></span><input type="checkbox" id="module-danmaku" role="switch"></label>
          <label class="switch-row"><span><strong>隐藏广告与推广</strong><small>收起活动、下载、直播和商品推广</small></span><input type="checkbox" id="module-ads" role="switch"></label>
        </div>
      </section>
      <section class="section exceptions">
        <details>
          <summary>例外页面 <span>需要时再设置</span></summary>
          <p id="whitelist-help">这些页面将恢复完整显示。每行一个完整 B 站网址，可在路径中用 * 匹配。网络放行在下次访问或刷新后生效。</p>
          <label class="textarea-label" for="whitelist-allowed-urls">页面网址</label>
          <textarea id="whitelist-allowed-urls" rows="4" spellcheck="false" aria-describedby="whitelist-help whitelist-error" placeholder="例如：https://www.bilibili.com/video/BV*/"></textarea>
          <p id="whitelist-error" class="error" role="alert"></p>
          <div class="actions"><button type="button" class="primary-button" id="save-whitelist">保存例外页面</button></div>
        </details>
      </section>
      <footer class="reset-row"><div><strong>恢复默认设置</strong><p>重新开启全部防干扰功能，保留例外页面。</p></div><button type="button" class="secondary-button" id="reset-modules">恢复默认设置</button></footer>
    </fieldset>
    <p class="footnote">设置会同步到已打开的页面。若要恢复之前被拦截的内容，可在方便时手动刷新。</p>
  </main>
  <script src="../settings.js"></script>
  <script src="../settings-ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
