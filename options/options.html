<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="options.css">
  <title>Bilibili Less 设置</title>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1>Bilibili Less 设置</h1>
        <p>管理模块开关和页面白名单。</p>
      </div>
      <span class="save-status" id="save-status">已同步</span>
    </header>

    <section class="section">
      <div class="section-heading">
        <h2>基础控制</h2>
        <p>控制扩展是否启用，以及首页是否回到关注动态。</p>
      </div>
      <div class="module-grid">
        <label class="switch-row">
          <span>
            <strong>启用扩展</strong>
            <small>控制所有页面清理、网络拦截和重定向</small>
          </span>
          <input type="checkbox" id="enabled" checked>
        </label>
        <label class="switch-row">
          <span>
            <strong>首页跳到关注动态</strong>
            <small>访问首页或分区页时自动跳转到关注动态</small>
          </span>
          <input type="checkbox" id="module-redirect" checked>
        </label>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>视频页</h2>
        <p>减少视频页里的推荐、评论、弹幕和自动续播。</p>
      </div>
      <div class="module-grid">
        <label class="switch-row">
          <span><strong>隐藏右侧推荐</strong><small>隐藏视频页右侧推荐、相关视频和部分推荐接口</small></span>
          <input type="checkbox" id="module-recommendations" checked>
        </label>
        <label class="switch-row">
          <span><strong>隐藏评论区</strong><small>隐藏视频页评论区域</small></span>
          <input type="checkbox" id="module-comments" checked>
        </label>
        <label class="switch-row">
          <span><strong>隐藏弹幕</strong><small>隐藏弹幕层、弹幕开关、输入框和列表</small></span>
          <input type="checkbox" id="module-danmaku" checked>
        </label>
        <label class="switch-row">
          <span><strong>禁用自动连播</strong><small>视频自然结束后不自动播放下一个内容</small></span>
          <input type="checkbox" id="module-autoplay" checked>
        </label>
        <label class="switch-row">
          <span><strong>隐藏播放结束推荐</strong><small>隐藏视频结束后的推荐覆盖层和更多推荐入口</small></span>
          <input type="checkbox" id="module-ending" checked>
        </label>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>关注动态</h2>
        <p>收起动态页里的互动反馈，保留正常浏览动态。</p>
      </div>
      <div class="module-grid">
        <label class="switch-row">
          <span><strong>隐藏动态互动</strong><small>隐藏动态评论、点赞评论入口和互动提示</small></span>
          <input type="checkbox" id="module-dynamic" checked>
        </label>
        <label class="switch-row">
          <span><strong>开启搜索功能</strong><small>显示搜索栏并允许进入搜索结果页</small></span>
          <input type="checkbox" id="module-search" checked>
        </label>
        <label class="switch-row">
          <span><strong>隐藏热榜和分享入口</strong><small>隐藏热搜词、视频标签和分享扩散入口</small></span>
          <input type="checkbox" id="module-exploration" checked>
        </label>
        <label class="switch-row">
          <span><strong>隐藏顶部导航</strong><small>隐藏首页、直播、番剧等容易偏离观看目标的顶部入口</small></span>
          <input type="checkbox" id="module-navigation" checked>
        </label>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>推广和白名单</h2>
        <p>处理广告推广，并放行你确实想完整访问的页面。</p>
      </div>
      <div class="module-grid">
        <label class="switch-row">
          <span><strong>隐藏广告和推广</strong><small>隐藏广告、活动、下载提示、直播和游戏推广</small></span>
          <input type="checkbox" id="module-ads" checked>
        </label>
      </div>
      <textarea id="whitelist-allowed-urls" rows="7" spellcheck="false" placeholder="https://www.bilibili.com/
https://www.bilibili.com/v/popular
https://www.bilibili.com/video/BV*/"></textarea>
      <div class="actions">
        <button type="button" class="secondary-button" id="reset-modules">恢复默认模块</button>
        <button type="button" class="primary-button" id="save-whitelist">保存白名单</button>
      </div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
