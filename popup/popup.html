<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Bilibili Less</title>
</head>
<body>
  <main class="panel">
    <header class="header">
      <img src="../icons/icon48.png" width="32" height="32" alt="">
      <div><h1>Bilibili Less</h1><p>只看关注，主动搜索。</p></div>
    </header>
    <fieldset id="settings-controls" disabled>
      <label class="switch-row primary">
        <span><strong>减少干扰</strong><small id="statusText">正在读取设置…</small></span>
        <input type="checkbox" id="enabled" role="switch">
      </label>
      <section class="entry-section" aria-label="主动观看">
        <a class="feed-button" href="https://t.bilibili.com/" target="_blank" rel="noopener">查看关注动态 <span aria-hidden="true">↗</span></a>
        <form id="search-form" class="search-form">
          <label class="sr-only" for="search-keyword">搜索你想看的内容</label>
          <input id="search-keyword" type="search" placeholder="搜索你想看的内容" autocomplete="off" required maxlength="200">
          <button id="search-submit" type="submit">搜索</button>
        </form>
        <p class="search-note" id="search-note">输入关键词，直接进入搜索结果。</p>
        <a class="history-link" href="https://www.bilibili.com/account/history" target="_blank" rel="noopener">观看历史 <span aria-hidden="true">↗</span></a>
      </section>
      <section class="preferences" aria-label="观看偏好">
        <label class="switch-row"><span><strong>隐藏评论</strong></span><input type="checkbox" id="module-comments" role="switch"></label>
        <label class="switch-row"><span><strong>隐藏弹幕</strong></span><input type="checkbox" id="module-danmaku" role="switch"></label>
      </section>
    </fieldset>
    <p class="protection-summary" id="protection-summary">推荐、热搜和自动连播默认关闭。</p>
    <footer><button type="button" class="options-link" id="open-options">更多设置 <span aria-hidden="true">→</span></button><span id="save-status" role="status" aria-live="polite">正在读取…</span></footer>
  </main>
  <script src="../settings.js"></script>
  <script src="../settings-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
